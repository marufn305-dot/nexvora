<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXVORA - Payment</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7f6;
    color:#222;
}

.header{
    background:#008f4c;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:25px;
}

.container{
    max-width:600px;
    margin:20px auto;
    padding:15px;
}

.payment-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.payment-card h2{
    margin-bottom:15px;
}

.amount{
    background:#f0f8f4;
    padding:15px;
    border-radius:10px;
    margin-bottom:18px;
}

.amount p{
    color:#666;
}

.amount h2{
    color:#008f4c;
    margin-top:5px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    background:white;
}

.seller-payment{
    background:#fff9e6;
    padding:15px;
    border-radius:10px;
    margin-bottom:18px;
}

.seller-payment p{
    margin:7px 0;
}

.upload{
    border:1px dashed #aaa;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#008f4c;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.note{
    margin-top:15px;
    padding:12px;
    background:#f0f8f4;
    border-radius:8px;
    color:#555;
    font-size:13px;
}

</style>
</head>

<body>

<div class="header">

    <h1>NEXVORA</h1>

    <p>Customer Payment</p>

</div>


<div class="container">

    <div class="payment-card">

        <h2>Order Payment</h2>


        <!-- Payment Amount -->

        <div class="amount">

            <p>Total Payment</p>

            <h2>৳1,000</h2>

        </div>


        <!-- NEXVORA Payment -->

        <div class="seller-payment">

            <strong>
                NEXVORA Payment
            </strong>

            <p>
                Payment Method অনুযায়ী NEXVORA-এর
                অনুমোদিত payment account ব্যবহার করুন।
            </p>

        </div>


        <!-- Payment Method -->

        <label>
            Payment Method
        </label>

        <select id="method">

            <option value="">
                Payment Method নির্বাচন করুন
            </option>

            <option value="bkash">
                bKash
            </option>

            <option value="nagad">
                Nagad
            </option>

            <option value="rocket">
                Rocket
            </option>

            <option value="upay">
                Upay
            </option>

            <option value="bank">
                Bank
            </option>

        </select>


        <!-- Transaction ID -->

        <label>
            Transaction ID
        </label>

        <input
            type="text"
            id="transaction"
            placeholder="আপনার Transaction ID লিখুন"
        >


        <!-- Screenshot -->

        <label>
            Payment Screenshot
        </label>

        <div class="upload">

            <input
                type="file"
                id="screenshot"
                accept="image/*"
            >

        </div>


        <button onclick="submitPayment()">

            Payment Submit করুন

        </button>


        <div class="note">

            Payment Submit করার পর Admin payment verification করবে।
            Verification সম্পন্ন হলে Order-এর payment status update হবে।

        </div>

    </div>

</div>


<script>

function submitPayment(){

    const method =
        document.getElementById("method").value;

    const transaction =
        document.getElementById("transaction").value.trim();

    const screenshot =
        document.getElementById("screenshot").files.length;


    if(method === ""){

        alert("Payment Method নির্বাচন করুন।");

        return;
    }


    if(transaction === ""){

        alert("Transaction ID লিখুন।");

        return;
    }


    if(screenshot === 0){

        alert("Payment Screenshot দিন।");

        return;
    }


    alert(

        "Payment তথ্য সফলভাবে Submit হয়েছে!\n\n" +

        "Transaction ID: " + transaction +

        "\n\nAdmin Verification-এর পর Order Payment Confirm হবে।"

    );

}

</script>

</body>
</html>
