<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXVORA - Add Product</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7f6;
    color:#222;
}

header{
    background:#008f4c;
    color:white;
    padding:18px;
}

.header-box{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.back-btn{
    background:white;
    color:#008f4c;
    border:0;
    padding:10px 15px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h1{
    color:#008f4c;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#008f4c;
}

.price-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.image-preview{
    width:100%;
    height:220px;
    background:#edf1ef;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-top:10px;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.preview-text{
    color:#777;
}

.save-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#008f4c;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.cancel-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:7px;
    background:#eee;
    color:#222;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.message{
    display:none;
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    font-weight:bold;
}

.products-box{
    margin-top:25px;
}

.products-box h2{
    color:#008f4c;
    margin-bottom:15px;
}

.product-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.product-card{
    border:1px solid #ddd;
    border-radius:9px;
    padding:12px;
    background:white;
}

.product-image{
    width:100%;
    height:150px;
    background:#edf1ef;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:10px;
    font-size:50px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.product-card h3{
    font-size:16px;
    margin-bottom:6px;
}

.product-category{
    color:#666;
    font-size:14px;
}

.product-price{
    color:#008f4c;
    font-weight:bold;
    margin-top:7px;
    font-size:18px;
}

.product-stock{
    color:#1769aa;
    font-size:13px;
    margin-top:5px;
}

.delete-btn{
    width:100%;
    border:0;
    background:#e53935;
    color:white;
    padding:9px;
    border-radius:6px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

.empty{
    background:#f5f7f6;
    padding:25px;
    text-align:center;
    color:#777;
    border-radius:8px;
}

@media(max-width:700px){

    .price-row{
        grid-template-columns:1fr;
    }

    .product-list{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:450px){

    .product-list{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<header>

<div class="header-box">

<div class="logo">
NEXVORA Seller Center
</div>

<button
class="back-btn"
onclick="goSeller()">

← Seller Dashboard

</button>

</div>

</header>


<div class="container">


<div class="box">

<h1>
➕ Add New Product
</h1>


<div
class="message"
id="message">
</div>


<div class="form-group">

<label>
Product Name *
</label>

<input
id="productName"
type="text"
placeholder="Enter product name">

</div>


<div class="form-group">

<label>
Category *
</label>

<select id="productCategory">

<option value="">
Select category
</option>

<option value="Men's Fashion">
Men's Fashion
</option>

<option value="Women's Fashion">
Women's Fashion
</option>

<option value="Electronics">
Electronics
</option>

<option value="Mobile & Accessories">
Mobile & Accessories
</option>

<option value="Home & Living">
Home & Living
</option>

<option value="Beauty & Personal Care">
Beauty & Personal Care
</option>

<option value="Sports">
Sports
</option>

<option value="Kids & Toys">
Kids & Toys
</option>

<option value="Groceries">
Groceries
</option>

<option value="Shoes">
Shoes
</option>

<option value="Bags">
Bags
</option>

<option value="Watches">
Watches
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div class="price-row">


<div class="form-group">

<label>
Price (৳) *
</label>

<input
id="productPrice"
type="number"
min="0"
placeholder="Example: 1000">

</div>


<div class="form-group">

<label>
Discount (%)
</label>

<input
id="productDiscount"
type="number"
min="0"
max="100"
value="0"
placeholder="Example: 10">

</div>

</div>


<div class="form-group">

<label>
Stock Quantity *
</label>

<input
id="productStock"
type="number"
min="0"
placeholder="Example: 20">

</div>


<div class="form-group">

<label>
Product Description
</label>

<textarea
id="productDescription"
placeholder="Write product details..."></textarea>

</div>


<div class="form-group">

<label>
Product Image
</label>

<input
id="productImage"
type="file"
accept="image/*"
onchange="previewImage(event)">


<div
class="image-preview"
id="imagePreview">

<div class="preview-text">
📷 Product image preview
</div>

</div>

</div>


<button
type="button"
class="save-btn"
onclick="saveProduct()">

✅ Publish Product

</button>


<button
type="button"
class="cancel-btn"
onclick="goSeller()">

Cancel

</button>

</div>


<div class="box products-box">

<h2>
📦 My Products
</h2>

<div
class="product-list"
id="productList">
</div>

</div>


</div>


<script>


/* =====================================
   IMAGE
===================================== */

let selectedImage = "";


/* =====================================
   GET PRODUCTS
===================================== */

function getProducts(){

    try{

        const saved =
            localStorage.getItem(
                "nexvoraProducts"
            );

        if(!saved){

            return [];

        }


        const products =
            JSON.parse(saved);


        if(!Array.isArray(products)){

            return [];

        }


        return products;

    }catch(error){

        console.error(
            "Get Products Error:",
            error
        );

        return [];

    }

}


/* =====================================
   IMAGE PREVIEW
===================================== */

function previewImage(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    /* Maximum 2MB */

    if(
        file.size >
        2 * 1024 * 1024
    ){

        showMessage(
            "❌ Image is too large. Please choose an image under 2MB.",
            true
        );


        event.target.value = "";


        selectedImage = "";


        return;

    }


    if(
        !file.type.startsWith("image/")
    ){

        showMessage(
            "❌ Please select a valid image.",
            true
        );


        event.target.value = "";


        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            selectedImage =
                e.target.result;


            document.getElementById(
                "imagePreview"
            ).innerHTML = `

                <img
                    src="${selectedImage}"
                    alt="Product Preview">

            `;

        };


    reader.onerror =
        function(){

            showMessage(
                "❌ Could not read the image.",
                true
            );

        };


    reader.readAsDataURL(file);

}


/* =====================================
   SAVE PRODUCT
===================================== */

function saveProduct(){

    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const discount =
        Number(
            document.getElementById(
                "productDiscount"
            ).value
        ) || 0;


    const stock =
        Number(
            document.getElementById(
                "productStock"
            ).value
        );


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    /* VALIDATION */

    if(!name){

        showMessage(
            "Please enter product name.",
            true
        );

        return;

    }


    if(!category){

        showMessage(
            "Please select a category.",
            true
        );

        return;

    }


    if(
        !Number.isFinite(price) ||
        price <= 0
    ){

        showMessage(
            "Please enter a valid price.",
            true
        );

        return;

    }


    if(
        !Number.isFinite(stock) ||
        stock < 0
    ){

        showMessage(
            "Please enter valid stock quantity.",
            true
        );

        return;

    }


    if(
        discount < 0 ||
        discount > 100
    ){

        showMessage(
            "Discount must be between 0 and 100.",
            true
        );

        return;

    }


    /* FINAL PRICE */

    const finalPrice =
        price -
        (
            price *
            discount /
            100
        );


    /* PRODUCT OBJECT */

    const product = {

        id:
            "PROD-" +
            Date.now(),

        name:
            name,

        category:
            category,

        price:
            price,

        discount:
            discount,

        finalPrice:
            finalPrice,

        stock:
            stock,

        description:
            description,

        image:
            selectedImage || "",

        createdAt:
            new Date().toLocaleString()

    };


    /* SAVE TO LOCAL STORAGE */

    try{

        const products =
            getProducts();


        products.push(
            product
        );


        const data =
            JSON.stringify(
                products
            );


        localStorage.setItem(
            "nexvoraProducts",
            data
        );


        /* VERIFY */

        const verify =
            localStorage.getItem(
                "nexvoraProducts"
            );


        if(!verify){

            showMessage(
                "❌ Product could not be saved.",
                true
            );

            return;

        }


        /* SUCCESS */

        showMessage(
            "✅ Product published successfully!"
        );


        clearForm();


        renderProducts();


    }catch(error){

        console.error(
            "NEXVORA Save Error:",
            error
        );


        showMessage(
            "❌ Product could not be saved. Try without an image.",
            true
        );

    }

}


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    error = false
){

    const box =
        document.getElementById(
            "message"
        );


    if(!box){

        return;

    }


    box.textContent =
        text;


    box.style.display =
        "block";


    if(error){

        box.style.background =
            "#f8d7da";

        box.style.color =
            "#721c24";

    }else{

        box.style.background =
            "#d4edda";

        box.style.color =
            "#155724";

    }


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        3000
    );

}


/* =====================================
   CLEAR FORM
===================================== */

function clearForm(){

    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productCategory"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productDiscount"
    ).value = "0";


    document.getElementById(
        "productStock"
    ).value = "";


    document.getElementById(
        "productDescription"
    ).value = "";


    document.getElementById(
        "productImage"
    ).value = "";


    selectedImage =
        "";


    document.getElementById(
        "imagePreview"
    ).innerHTML = `

        <div class="preview-text">
            📷 Product image preview
        </div>

    `;

}


/* =====================================
   RENDER PRODUCTS
===================================== */

function renderProducts(){

    const products =
        getProducts();


    const list =
        document.getElementById(
            "productList"
        );


    if(!list){

        return;

    }


    list.innerHTML = "";


    if(products.length === 0){

        list.innerHTML = `

            <div class="empty">

                📦 No products added yet.

            </div>

        `;

        return;

    }


    products
    .slice()
    .reverse()
    .forEach(
        function(product){

            const price =
                Number(
                    product.finalPrice
                )
                ||
                Number(
                    product.price
                )
                ||
                0;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            card.innerHTML = `

                <div class="product-image">

                    ${
                        product.image
                        &&
                        String(product.image)
                        .startsWith("data:image")
                        ?

                        `
                        <img
                            src="${product.image}"
                            alt="${product.name || "Product"}">
                        `

                        :

                        "📦"

                    }

                </div>


                <h3>
                    ${product.name || "Unnamed Product"}
                </h3>


                <div class="product-category">

                    ${product.category || "Other"}

                </div>


                <div class="product-price">

                    ৳${price.toLocaleString()}

                </div>


                <div class="product-stock">

                    📦 Stock:
                    ${Number(product.stock) || 0}

                </div>


                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteProduct('${product.id}')">

                    🗑️ Delete

                </button>

            `;


            list.appendChild(
                card
            );

        }
    );

}


/* =====================================
   DELETE PRODUCT
===================================== */

function deleteProduct(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if(!confirmDelete){

        return;

    }


    let products =
        getProducts();


    products =
        products.filter(
            function(product){

                return String(
                    product.id
                )
                !==
                String(id);

            }
        );


    try{

        localStorage.setItem(
            "nexvoraProducts",
            JSON.stringify(products)
        );


        renderProducts();


        showMessage(
            "✅ Product deleted successfully."
        );

    }catch(error){

        showMessage(
            "❌ Could not delete product.",
            true
        );

    }

}


/* =====================================
   SELLER DASHBOARD
===================================== */

function goSeller(){

    window.location.href =
        "seller.html";

}


/* =====================================
   START
===================================== */

renderProducts();

</script>


</body>

</html>
