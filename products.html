<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXVORA - My Products</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7f6;
    color:#222;
}

header{
    background:#008f4c;
    color:white;
    padding:16px;
}

.header-content{
    width:94%;
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:10px;
}

h1{
    color:#008f4c;
    font-size:25px;
}

.add{
    background:#008f4c;
    color:white;
    text-decoration:none;
    padding:11px 15px;
    border-radius:7px;
    font-weight:bold;
}

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.product{
    background:white;
    padding:16px;
    border-radius:12px;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
}

.icon{
    height:120px;
    background:#e9eeee;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.product h3{
    margin-top:12px;
}

.price{
    color:#008f4c;
    font-size:18px;
    font-weight:bold;
    margin:7px 0;
}

.info{
    color:#666;
    font-size:14px;
    margin:5px 0;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.edit{
    background:#008f4c;
    color:white;
}

.delete{
    background:#f8d7da;
    color:#721c24;
}

.empty{
    background:white;
    padding:35px 20px;
    border-radius:12px;
    text-align:center;
    color:#777;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
}

@media(max-width:600px){

    .top{
        align-items:flex-start;
    }

    h1{
        font-size:21px;
    }

    .products{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>

    <div class="header-content">

        <div class="logo">
            NEXVORA Seller Center
        </div>

        <a
            class="back"
            href="seller-dashbord.html">
            ← Dashboard
        </a>

    </div>

</header>


<div class="container">

    <div class="top">

        <h1>
            🛍️ My Products
        </h1>

        <a
            class="add"
            href="add-product.html">
            ➕ Add Product
        </a>

    </div>


    <div
        class="products"
        id="productList">
    </div>

</div>


<script>

function getProducts(){

    const saved =
        localStorage.getItem("nexvoraProducts");

    if(!saved){
        return [];
    }

    try{

        const products =
            JSON.parse(saved);

        return Array.isArray(products)
            ? products
            : [];

    }catch(error){

        return [];

    }

}


function displayProducts(){

    const list =
        document.getElementById("productList");

    const products =
        getProducts();


    list.innerHTML = "";


    if(products.length === 0){

        list.innerHTML = `
            <div class="empty">
                <h2>No Products Yet</h2>

                <p style="margin-top:10px;">
                    You have not added any products yet.
                </p>

                <a
                    href="add-product.html"
                    style="
                        display:inline-block;
                        margin-top:18px;
                        background:#008f4c;
                        color:white;
                        padding:11px 16px;
                        border-radius:7px;
                        text-decoration:none;
                        font-weight:bold;
                    ">
                    ➕ Add Your First Product
                </a>
            </div>
        `;

        return;

    }


    products.forEach(function(product,index){

        const card =
            document.createElement("div");

        card.className = "product";


        card.innerHTML = `

            <div class="icon">
                📦
            </div>

            <h3>
                ${product.name || "Unnamed Product"}
            </h3>

            <div class="price">
                ৳${Number(product.price || 0).toLocaleString()}
            </div>

            <div class="info">
                Stock:
                ${product.stock || 0}
            </div>

            <div class="info">
                Category:
                ${product.category || "General"}
            </div>

            <div class="info">
                Product ID:
                ${product.id || "-"}
            </div>

            <div class="buttons">

                <button
                    class="edit"
                    onclick="editProduct(${index})">
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteProduct(${index})">
                    🗑️ Delete
                </button>

            </div>

        `;


        list.appendChild(card);

    });

}


function deleteProduct(index){

    const products =
        getProducts();


    if(!confirm(
        "Are you sure you want to delete this product?"
    )){
        return;
    }


    products.splice(index,1);


    localStorage.setItem(
        "nexvoraProducts",
        JSON.stringify(products)
    );


    displayProducts();

}


function editProduct(index){

    const products =
        getProducts();

    const product =
        products[index];


    if(!product){
        return;
    }


    const newName =
        prompt(
            "Enter product name:",
            product.name || ""
        );


    if(newName === null){
        return;
    }


    const newPrice =
        prompt(
            "Enter product price:",
            product.price || ""
        );


    if(newPrice === null){
        return;
    }


    const newStock =
        prompt(
            "Enter product stock:",
            product.stock || ""
        );


    if(newStock === null){
        return;
    }


    product.name =
        newName.trim() || product.name;

    product.price =
        Number(newPrice) || product.price;

    product.stock =
        Number(newStock) || product.stock;


    products[index] =
        product;


    localStorage.setItem(
        "nexvoraProducts",
        JSON.stringify(products)
    );


    displayProducts();


    alert(
        "✅ Product updated successfully!"
    );

}


displayProducts();

</script>

</body>
</html>
