<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXVORA - Checkout</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f7f6;
}

header{
  background:#008f4c;
  color:white;
  padding:18px;
}

.logo{
  font-size:27px;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:700px;
  margin:25px auto;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  color:#008f4c;
  margin-top:0;
}

input,
textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:6px;
}

textarea{
  height:90px;
  resize:none;
}

.order-item{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:19px;
  font-weight:bold;
}

.payment-option{
  display:block;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:7px;
  cursor:pointer;
}

.payment-option input{
  width:auto;
  margin-right:8px;
}

.place-order{
  width:100%;
  padding:14px;
  border:none;
  border-radius:7px;
  background:#008f4c;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
}

.back{
  display:block;
  text-align:center;
  color:#008f4c;
  text-decoration:none;
  margin-top:15px;
}

</style>
</head>

<body>

<header>
  <div class="logo">NEXVORA Checkout</div>
</header>


<div class="container">


<!-- ORDER -->

<div class="card">

<h2>🛒 Your Order</h2>

<div id="orderList"></div>

<div class="total">

<span>Total</span>

<span id="totalPrice">৳0</span>

</div>

</div>


<!-- DELIVERY -->

<div class="card">

<h2>🚚 Delivery Information</h2>

<input
type="text"
id="customerName"
placeholder="Full Name">

<input
type="tel"
id="customerPhone"
placeholder="Phone Number">

<textarea
id="customerAddress"
placeholder="Delivery Address"></textarea>

</div>


<!-- PAYMENT -->

<div class="card">

<h2>💳 Payment Method</h2>

<div id="paymentOptions"></div>

</div>


<button
class="place-order"
onclick="placeOrder()">

Confirm Order

</button>


<a
class="back"
href="product.html">

← Back to Products

</a>

</div>


<script>

/* CART */

const cart =
JSON.parse(
localStorage.getItem("nexvoraCart")
) || [];


/* DISPLAY ORDER */

function displayOrder(){

const list =
document.getElementById("orderList");

if(cart.length === 0){

list.innerHTML =
'<div class="empty">Your cart is empty.</div>';

return;

}

let total=0;

list.innerHTML="";


cart.forEach(function(item){

const row =
document.createElement("div");

row.className="order-item";

row.innerHTML=`

<span>${item.name}</span>

<strong>
৳${Number(item.price).toLocaleString()}
</strong>

`;

list.appendChild(row);

total += Number(item.price);

});


document.getElementById(
"totalPrice"
).textContent =
"৳"+total.toLocaleString();

}


/* PAYMENT SETTINGS */

/* PAYMENT SETTINGS */

function loadPaymentOptions() {
  
  const box =
    document.getElementById("paymentOptions");
  
  
  box.innerHTML = `

<label class="payment-option">

<input
type="radio"
name="payment"
value="Cash on Delivery">

💵 Cash on Delivery

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="bKash">

💳 bKash

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="Nagad">

💳 Nagad

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="Rocket">

💳 Rocket

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="Upay">

💳 Upay

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="Bank Card">

💳 Bank Card

</label>

`;
}


/* PLACE ORDER */

function placeOrder(){

if(cart.length===0){

alert("Your cart is empty.");

return;

}


const name =
document.getElementById(
"customerName"
).value.trim();

const phone =
document.getElementById(
"customerPhone"
).value.trim();

const address =
document.getElementById(
"customerAddress"
).value.trim();

const payment =
document.querySelector(
'input[name="payment"]:checked'
);


if(!name || !phone || !address){

alert(
"Please complete your delivery information."
);

return;

}


if(!payment){

alert(
"Please select a payment method."
);

return;

}


const order={

id:Date.now(),

customerName:name,

phone:phone,

address:address,

payment:payment.value,

items:cart,

date:new Date().toLocaleString()

};


const orders =
JSON.parse(
localStorage.getItem("nexvoraOrders")
) || [];


orders.push(order);


localStorage.setItem(
"nexvoraOrders",
JSON.stringify(orders)
);


alert(
"Order confirmed successfully!"
);


/* CLEAR CART */

localStorage.removeItem(
"nexvoraCart"
);


/* GO HOME */

window.location.href="index.html";

}


/* START */

displayOrder();

loadPaymentOptions();

</script>

</body>
</html>
