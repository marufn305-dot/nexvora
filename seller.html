<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXVORA Seller Center</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:#008f4c;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.home-btn{
    background:white;
    color:#008f4c;
    text-decoration:none;
    padding:8px 13px;
    border-radius:6px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 15px;
}

.welcome{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.welcome h2{
    color:#008f4c;
    margin-bottom:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    font-size:15px;
    margin-bottom:10px;
}

.card p{
    color:#008f4c;
    font-size:25px;
    font-weight:bold;
}

.form-box,
.orders-box,
.products-box{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-box h2,
.orders-box h2,
.products-box h2{
    color:#008f4c;
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.price-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.discount-result{
    margin-top:12px;
    padding:12px;
    background:#eaf8f0;
    border-radius:7px;
    color:#008f4c;
    font-weight:bold;
    display:none;
}

.image-box{
    border:2px dashed #008f4c;
    border-radius:8px;
    padding:20px;
    text-align:center;
    margin-top:5px;
}

.image-box input{
    border:none;
}

#imagePreview{
    display:none;
    width:180px;
    height:180px;
    object-fit:cover;
    margin:15px auto 0;
    border-radius:10px;
}

.publish-btn{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#008f4c;
    color:white;
    border:none;
    border-radius:7px;
    font-size:17px;
    font-weight:bold;
}

.product{
    background:#f8faf9;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    display:flex;
    gap:15px;
    border:1px solid #e1e1e1;
}

.product-img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:8px;
    background:#eee;
}

.product-info{
    flex:1;
}

.product-info h3{
    color:#008f4c;
    margin-bottom:7px;
}

.old-price{
    text-decoration:line-through;
    color:#888;
}

.new-price{
    color:#008f4c;
    font-weight:bold;
    font-size:18px;
}

.discount-badge{
    display:inline-block;
    background:#e53935;
    color:white;
    padding:4px 8px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
}

.stock{
    display:inline-block;
    background:#eef5ff;
    color:#1769aa;
    padding:5px 8px;
    border-radius:5px;
    font-weight:bold;
    margin-top:5px;
}

.delete-btn,
.delete-order{
    margin-top:10px;
    padding:8px 12px;
    background:#d93025;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.empty{
    background:#f8faf9;
    padding:25px;
    border-radius:10px;
    text-align:center;
    color:#777;
}


/* ORDERS */

.order-card{
    background:#f8faf9;
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin-bottom:18px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid #ddd;
    padding-bottom:12px;
    margin-bottom:12px;
}

.order-id{
    color:#008f4c;
    font-weight:bold;
}

.order-status{
    background:#e5f7ed;
    color:#008f4c;
    padding:5px 9px;
    border-radius:5px;
    font-weight:bold;
}

.customer-info{
    background:white;
    padding:12px;
    border-radius:8px;
    margin-bottom:12px;
}

.customer-info p{
    margin:7px 0;
}

.order-items{
    background:white;
    padding:12px;
    border-radius:8px;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #eee;
}

.order-item:last-child{
    border-bottom:none;
}

.order-total{
    margin-top:12px;
    padding-top:12px;
    border-top:2px solid #ddd;
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
    color:#008f4c;
}

.no-orders{
    background:#f8faf9;
    padding:30px;
    text-align:center;
    border-radius:10px;
    color:#777;
}

.refresh-btn{
    background:#008f4c;
    color:white;
    border:none;
    padding:9px 14px;
    border-radius:6px;
    cursor:pointer;
    margin-bottom:15px;
}

@media(max-width:700px){

    .cards{
        grid-template-columns:1fr;
    }

    .price-row{
        grid-template-columns:1fr;
    }

    .product{
        flex-direction:column;
    }

    .product-img{
        width:130px;
        height:130px;
    }

    .order-item{
        flex-direction:column;
    }

}

</style>

</head>

<body>


<header>

<div class="logo">
NEXVORA Seller Center
</div>

<a
href="index.html"
class="home-btn">
🏠 Home
</a>

</header>


<div class="container">


<div class="welcome">

<h2>
Seller Dashboard
</h2>

<p>
Add products and manage customer orders from one place.
</p>

</div>


<div class="cards">

<div class="card">

<h3>
Total Products
</h3>

<p id="totalProducts">
0
</p>

</div>


<div class="card">

<h3>
Published Products
</h3>

<p id="publishedProducts">
0
</p>

</div>


<div class="card">

<h3>
Customer Orders
</h3>

<p id="totalOrders">
0
</p>

</div>

</div>


<!-- ADD PRODUCT -->

<div class="form-box">

<h2>
➕ Add New Product
</h2>

<form id="productForm">


<label>
Product Name
</label>

<input
type="text"
id="productName"
placeholder="Enter product name"
required
>


<div class="price-row">

<div>

<label>
Regular Price (৳)
</label>

<input
type="number"
id="productPrice"
placeholder="Example: 1000"
min="0"
required
>

</div>


<div>

<label>
Discount (%)
</label>

<input
type="number"
id="productDiscount"
placeholder="Example: 10"
min="0"
max="100"
value="0"
>

</div>

</div>


<div
id="discountResult"
class="discount-result">
</div>


<label>
Stock Quantity
</label>

<input
type="number"
id="productStock"
placeholder="Available quantity"
min="0"
required
>


<label>
Product Category
</label>

<select
id="productCategory"
required
>

<option value="">
Select Category
</option>

<option>Men's Fashion</option>
<option>Women's Fashion</option>
<option>Electronics</option>
<option>Mobile & Accessories</option>
<option>Computers</option>
<option>Home & Living</option>
<option>Beauty & Personal Care</option>
<option>Sports</option>
<option>Kids & Toys</option>
<option>Groceries</option>
<option>Shoes</option>
<option>Bags</option>
<option>Watches</option>
<option>Other</option>

</select>


<label>
Product Image
</label>

<div class="image-box">

<p>
🖼️ Select product image
</p>

<input
type="file"
id="productImage"
accept="image/*"
required
>

<img
id="imagePreview"
alt="Product Preview"
>

</div>


<label>
Product Description
</label>

<textarea
id="productDescription"
placeholder="Write product details..."
required
></textarea>


<button
type="submit"
class="publish-btn">

🚀 Publish Product

</button>

</form>

</div>


<!-- CUSTOMER ORDERS -->

<div class="orders-box">

<h2>
🧾 Customer Orders
</h2>

<button
class="refresh-btn"
onclick="showOrders()">

🔄 Refresh Orders

</button>

<div id="orderList">
</div>

</div>


<!-- PRODUCTS -->

<div class="products-box">

<h2>
📦 My Published Products
</h2>

<div id="productList">
</div>

</div>


</div>


<script>


/* ================================
   PRODUCTS
================================ */

let products =
JSON.parse(
localStorage.getItem(
"nexvoraProducts"
)
) || [];


/* ================================
   ORDERS
================================ */

function getOrders(){

return JSON.parse(
localStorage.getItem(
"nexvoraOrders"
)
) || [];

}


/* ================================
   DISCOUNT
================================ */

function calculateDiscount(){

const price =
Number(
document.getElementById(
"productPrice"
).value
);

const discount =
Number(
document.getElementById(
"productDiscount"
).value
) || 0;

const result =
document.getElementById(
"discountResult"
);

if(price > 0 && discount > 0){

const amount =
price * discount / 100;

const finalPrice =
price - amount;

result.innerHTML =
"Original Price: ৳"
+ price.toFixed(2)
+ "<br>"
+ "Discount: "
+ discount
+ "% (-৳"
+ amount.toFixed(2)
+ ")"
+ "<br>"
+ "Final Price: ৳"
+ finalPrice.toFixed(2);

result.style.display =
"block";

}else{

result.style.display =
"none";

}

}


document.getElementById(
"productPrice"
).addEventListener(
"input",
calculateDiscount
);


document.getElementById(
"productDiscount"
).addEventListener(
"input",
calculateDiscount
);


/* ================================
   IMAGE PREVIEW
================================ */

document.getElementById(
"productImage"
).addEventListener(
"change",
function(){

const file =
this.files[0];

const preview =
document.getElementById(
"imagePreview"
);

if(file){

const reader =
new FileReader();

reader.onload =
function(e){

preview.src =
e.target.result;

preview.style.display =
"block";

};

reader.readAsDataURL(file);

}

}
);


/* ================================
   PUBLISH PRODUCT
================================ */

document.getElementById(
"productForm"
).addEventListener(
"submit",
function(e){

e.preventDefault();

const file =
document.getElementById(
"productImage"
).files[0];

if(!file){

alert(
"Please select a product image."
);

return;

}


const price =
Number(
document.getElementById(
"productPrice"
).value
);

const discount =
Number(
document.getElementById(
"productDiscount"
).value
) || 0;

const stock =
Number(
document.getElementById(
"productStock"
).value
);

const finalPrice =
price -
(
price *
discount /
100
);


const reader =
new FileReader();


reader.onload =
function(e){

const product = {

id:
Date.now(),

name:
document.getElementById(
"productName"
).value.trim(),

price:
price,

discount:
discount,

finalPrice:
finalPrice,

stock:
stock,

category:
document.getElementById(
"productCategory"
).value,

image:
e.target.result,

description:
document.getElementById(
"productDescription"
).value.trim(),

published:
true

};


products.push(product);


localStorage.setItem(
"nexvoraProducts",
JSON.stringify(
products
)
);


alert(
"✅ Product published successfully!"
);


document.getElementById(
"productForm"
).reset();


document.getElementById(
"imagePreview"
).style.display =
"none";


document.getElementById(
"discountResult"
).style.display =
"none";


showProducts();

};


reader.readAsDataURL(file);

}
);


/* ================================
   SHOW PRODUCTS
================================ */

function showProducts(){

const list =
document.getElementById(
"productList"
);

const total =
document.getElementById(
"totalProducts"
);

const published =
document.getElementById(
"publishedProducts"
);


list.innerHTML =
"";


total.textContent =
products.length;


published.textContent =
products.filter(
function(product){

return product.published;

}
).length;


if(products.length === 0){

list.innerHTML = `

<div class="empty">

📦 No products published yet.

</div>

`;

return;

}


products.forEach(
function(product,index){

const div =
document.createElement(
"div"
);

div.className =
"product";


div.innerHTML = `

<img
class="product-img"
src="${product.image}"
alt="${product.name}"
>


<div class="product-info">

<h3>
${product.name}
</h3>


<p>

${
product.discount > 0
?
`<span class="old-price">
৳${product.price}
</span>`
:
""
}

<span class="new-price">

৳${Number(
product.finalPrice
).toFixed(2)}

</span>

</p>


${
product.discount > 0
?
`<span class="discount-badge">
${product.discount}% OFF
</span>`
:
""
}


<p>

<strong>
Category:
</strong>

${product.category}

</p>


<p>

<strong>
Stock:
</strong>

${product.stock}

units

</p>


<p>
${product.description}
</p>


<span class="stock">

📦 ${product.stock}
in stock

</span>


<br>


<button
class="delete-btn"
onclick="deleteProduct(${index})">

🗑️ Delete

</button>

</div>

`;


list.appendChild(
div
);

}
);

}


/* ================================
   DELETE PRODUCT
================================ */

function deleteProduct(index){

if(
confirm(
"Are you sure you want to delete this product?"
)
){

products.splice(
index,
1
);

localStorage.setItem(
"nexvoraProducts",
JSON.stringify(
products
)
);

showProducts();

}

}


/* ================================
   SHOW ORDERS
================================ */

function showOrders(){

const orders =
getOrders();

const container =
document.getElementById(
"orderList"
);

const totalOrders =
document.getElementById(
"totalOrders"
);


container.innerHTML =
"";


totalOrders.textContent =
orders.length;


if(orders.length === 0){

container.innerHTML = `

<div class="no-orders">

<h3>
📭 No Customer Orders Yet
</h3>

<br>

<p>
When a customer places an order,
it will appear here automatically.
</p>

</div>

`;

return;

}


/* newest order first */

orders
.slice()
.reverse()
.forEach(
function(order,index){

const div =
document.createElement(
"div"
);

div.className =
"order-card";


let itemsHTML =
"";

let subtotal =
0;


(order.items || [])
.forEach(
function(item){

const quantity =
Number(
item.quantity
) || 1;


const price =
Number(
item.price
) || 0;


const itemTotal =
price *
quantity;


subtotal +=
itemTotal;


itemsHTML += `

<div class="order-item">

<span>

🛍️
<strong>
${item.name}
</strong>

×
${quantity}

</span>


<span>

৳${itemTotal.toLocaleString()}

</span>

</div>

`;

}
);


const delivery =
60;


const total =
subtotal +
delivery;


div.innerHTML = `

<div class="order-header">

<div class="order-id">

🧾 Order ID:
${order.id}

</div>


<div class="order-status">

✓ New Order

</div>

</div>


<div class="customer-info">

<p>

👤
<strong>
Customer Name:
</strong>

${order.name || "N/A"}

</p>


<p>

📞
<strong>
Phone:
</strong>

${order.phone || "N/A"}

</p>


<p>

📍
<strong>
Delivery Address:
</strong>

${order.address || "N/A"}

</p>


<p>

💳
<strong>
Payment Method:
</strong>

${order.payment || "N/A"}

</p>


<p>

📅
<strong>
Order Date:
</strong>

${order.date || "N/A"}

</p>

</div>


<div class="order-items">

<h3>
🛍️ Ordered Products
</h3>

<br>

${itemsHTML}


<div class="order-total">

<span>
Total
</span>

<span>
৳${total.toLocaleString()}
</span>

</div>

</div>


<button
class="delete-order"
onclick="deleteOrder('${order.id}')">

🗑️ Delete Order

</button>

`;


container.appendChild(
div
);

}
);

}


/* ================================
   DELETE ORDER
================================ */

function deleteOrder(orderId){

if(
!confirm(
"Are you sure you want to delete this order?"
)
){

return;

}


let orders =
getOrders();


orders =
orders.filter(
function(order){

return String(order.id)
!==
String(orderId);

}
);


localStorage.setItem(
"nexvoraOrders",
JSON.stringify(
orders
)
);


showOrders();

}


/* ================================
   START
================================ */

showProducts();

showOrders();

</script>


</body>

</html>
