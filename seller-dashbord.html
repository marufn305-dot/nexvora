<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NEXVORA Seller Dashboard</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f7f6;
color:#222;
}

.header{
background:#008f4c;
color:white;
padding:18px;
}

.header-content{
width:94%;
max-width:1100px;
margin:auto;

display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:24px;
}

.header span{
font-size:13px;
opacity:.9;
}

.container{
width:94%;
max-width:1100px;
margin:20px auto;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.card{
background:white;
padding:20px;
border-radius:12px;

box-shadow:
0 2px 9px rgba(0,0,0,.08);
}

.card-icon{
font-size:27px;
}

.card-title{
color:#777;
margin-top:8px;
font-size:14px;
}

.card-number{
color:#008f4c;
font-size:27px;
font-weight:bold;
margin-top:5px;
}

.section{
background:white;
margin-top:20px;
padding:18px;
border-radius:12px;

box-shadow:
0 2px 9px rgba(0,0,0,.08);
}

.section h2{
color:#008f4c;
margin-bottom:15px;
}

.menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.menu a{
text-decoration:none;

background:#008f4c;
color:white;

padding:13px;

text-align:center;

border-radius:8px;

font-weight:bold;
}

.order{
padding:13px 0;
border-bottom:1px solid #eee;
}

.order:last-child{
border-bottom:none;
}

.order-id{
color:#008f4c;
font-weight:bold;
}

.status{
display:inline-block;

margin-top:5px;

padding:5px 9px;

border-radius:15px;

background:#fff3cd;
color:#856404;

font-size:12px;
}

.empty{
color:#777;
padding:15px 0;
}

@media(max-width:600px){

.cards{
grid-template-columns:repeat(2,1fr);
}

.menu{
grid-template-columns:1fr;
}

.header h1{
font-size:20px;
}

}

</style>

</head>


<body>


<div class="header">

<div class="header-content">

<div>

<h1>
NEXVORA Seller Center
</h1>

<span>
Seller Dashboard
</span>

</div>

<div>
🏪
</div>

</div>

</div>


<div class="container">


<!-- STATISTICS -->

<div class="cards">


<div class="card">

<div class="card-icon">
🛍️
</div>

<div class="card-title">
Total Products
</div>

<div
class="card-number"
id="totalProducts">

0

</div>

</div>


<div class="card">

<div class="card-icon">
🛒
</div>

<div class="card-title">
Total Orders
</div>

<div
class="card-number"
id="totalOrders">

0

</div>

</div>


<div class="card">

<div class="card-icon">
⏳
</div>

<div class="card-title">
Pending Orders
</div>

<div
class="card-number"
id="pendingOrders">

0

</div>

</div>


<div class="card">

<div class="card-icon">
🚚
</div>

<div class="card-title">
Shipped Orders
</div>

<div
class="card-number"
id="shippedOrders">

0

</div>

</div>


<div class="card">

<div class="card-icon">
✅
</div>

<div class="card-title">
Delivered Orders
</div>

<div
class="card-number"
id="deliveredOrders">

0

</div>

</div>


<div class="card">

<div class="card-icon">
💰
</div>

<div class="card-title">
Total Sales
</div>

<div
class="card-number"
id="totalSales">

৳0

</div>

</div>

</div>


<!-- QUICK ACTIONS -->

<div class="section">

<h2>
⚡ Quick Actions
</h2>


<div class="menu">


<!-- ADD PRODUCT -->

<a href="add-product.html">

➕ Add Product

</a>


<!-- MY PRODUCTS -->

<a href="my-products.html">

🛍️ My Products

</a>


<!-- SELLER ORDERS -->

<a href="seller-orders.html">

📦 Seller Orders

</a>


</div>

</div>


<!-- RECENT ORDERS -->

<div class="section">

<h2>
📦 Recent Orders
</h2>


<div id="recentOrders">

</div>

</div>


</div>


<script>


/* GET ORDERS */

function getOrders(){

try{

const data =
JSON.parse(
localStorage.getItem(
"nexvoraOrders"
)
);

return Array.isArray(data)
? data
: [];

}catch(error){

return [];

}

}


/* GET PRODUCTS */

function getProducts(){

try{

const data =
JSON.parse(
localStorage.getItem(
"nexvoraProducts"
)
);

return Array.isArray(data)
? data
: [];

}catch(error){

return [];

}

}


/* LOAD DASHBOARD */

function loadDashboard(){


const orders =
getOrders();


const products =
getProducts();


/* TOTAL PRODUCTS */

document.getElementById(
"totalProducts"
).textContent =
products.length;


/* TOTAL ORDERS */

document.getElementById(
"totalOrders"
).textContent =
orders.length;


/* ORDER STATUS */

let pending = 0;

let shipped = 0;

let delivered = 0;

let sales = 0;


orders.forEach(
function(order){


const status =
String(
order.status ||
"Pending"
).toLowerCase();


if(status === "pending"){

pending++;

}


if(status === "shipped"){

shipped++;

}


if(status === "delivered"){

delivered++;


sales +=
Number(
order.total
) || 0;

}


});


/* SHOW STATUS */

document.getElementById(
"pendingOrders"
).textContent =
pending;


document.getElementById(
"shippedOrders"
).textContent =
shipped;


document.getElementById(
"deliveredOrders"
).textContent =
delivered;


/* SALES */

document.getElementById(
"totalSales"
).textContent =
"৳" +
sales.toLocaleString();


/* RECENT ORDERS */

const recent =
document.getElementById(
"recentOrders"
);


if(
orders.length === 0
){

recent.innerHTML = `

<div class="empty">

No orders yet.

</div>

`;

return;

}


recent.innerHTML = "";


const latest =
orders
.slice(-5)
.reverse();


latest.forEach(
function(order){


recent.innerHTML += `

<div class="order">


<div class="order-id">

${order.id || "NEX-ORDER"}

</div>


<div>

👤
${order.customerName || "Customer"}

</div>


<div>

🛍️
${order.productName || "Product"}

</div>


<div>

💰
৳${order.total || 0}

</div>


<span class="status">

${order.status || "Pending"}

</span>


</div>

`;

});


}


/* START */

loadDashboard();


</script>


</body>
</html>
