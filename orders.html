<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXVORA - Orders</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f7f6;
}

header{
  background:#008f4c;
  color:white;
  padding:18px;
}

.logo{
  font-size:27px;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:800px;
  margin:25px auto;
}

.order{
  background:white;
  margin-bottom:18px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.order h2{
  color:#008f4c;
  margin-top:0;
}

.info{
  line-height:1.7;
  color:#444;
}

.items{
  background:#f5f7f6;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
}

.status{
  width:100%;
  padding:11px;
  margin-top:12px;
  border:1px solid #ddd;
  border-radius:6px;
}

.delete{
  width:100%;
  padding:11px;
  margin-top:10px;
  border:0;
  border-radius:6px;
  background:#d33;
  color:white;
}

.empty{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:12px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#008f4c;
  text-decoration:none;
}

</style>
</head>

<body>

<header>

<div class="logo">
NEXVORA Orders
</div>

</header>


<div class="container">

<div id="orders"></div>

<a
class="back"
href="index.html">

← Back to NEXVORA

</a>

</div>


<script>

function loadOrders(){

const orders =
JSON.parse(
localStorage.getItem("nexvoraOrders")
) || [];


const container =
document.getElementById("orders");


if(orders.length===0){

container.innerHTML=`

<div class="empty">

<h2>No Orders Yet</h2>

<p>
When a customer places an order,
it will appear here.
</p>

</div>

`;

return;

}


container.innerHTML="";


orders.forEach(function(order,index){

let items="";

order.items.forEach(function(item){

items += `

<div>
${item.name}
— ৳${Number(item.price).toLocaleString()}
</div>

`;

});


const total =
order.items.reduce(
function(sum,item){

return sum + Number(item.price);

},0);


const box =
document.createElement("div");

box.className="order";


box.innerHTML=`

<h2>
Order #${index+1}
</h2>

<div class="info">

<strong>Customer:</strong>
${order.customerName}

<br>

<strong>Phone:</strong>
${order.phone}

<br>

<strong>Address:</strong>
${order.address}

<br>

<strong>Payment:</strong>
${order.payment}

<br>

<strong>Date:</strong>
${order.date}

</div>


<div class="items">

<strong>Products</strong>

${items}

<hr>

<strong>
Total: ৳${total.toLocaleString()}
</strong>

</div>


<select
class="status"
onchange="changeStatus(${index},this.value)">

<option
${order.status==="Pending"?"selected":""}>
Pending
</option>

<option
${order.status==="Confirmed"?"selected":""}>
Confirmed
</option>

<option
${order.status==="Processing"?"selected":""}>
Processing
</option>

<option
${order.status==="Shipped"?"selected":""}>
Shipped
</option>

<option
${order.status==="Delivered"?"selected":""}>
Delivered
</option>

<option
${order.status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>


<button
class="delete"
onclick="deleteOrder(${index})">

Delete Order

</button>

`;


container.appendChild(box);

});

}


/* STATUS */

function changeStatus(index,status){

const orders =
JSON.parse(
localStorage.getItem("nexvoraOrders")
) || [];


orders[index].status=status;


localStorage.setItem(
"nexvoraOrders",
JSON.stringify(orders)
);


alert(
"Order status changed to: " +
status
);

}


/* DELETE */

function deleteOrder(index){

const confirmDelete =
confirm(
"Are you sure you want to delete this order?"
);

if(!confirmDelete){
return;
}


const orders =
JSON.parse(
localStorage.getItem("nexvoraOrders")
) || [];


orders.splice(index,1);


localStorage.setItem(
"nexvoraOrders",
JSON.stringify(orders)
);


loadOrders();

}


/* START */

loadOrders();

</script>

</body>
</html>
