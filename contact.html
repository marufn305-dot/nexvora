<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXVORA - Contact Support</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #222;
    }

    .header {
      background: #0b8f4d;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      margin-bottom: 18px;
    }

    .title {
      color: #0b8f4d;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .contact-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 9px;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .email {
      background: #0b8f4d;
      color: white;
    }

    .chat {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    .chat-box {
      display: none;
      margin-top: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .chat-header {
      background: #0b8f4d;
      color: white;
      padding: 12px;
      font-weight: bold;
    }

    .messages {
      height: 280px;
      overflow-y: auto;
      padding: 12px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      max-width: 85%;
      font-size: 14px;
    }

    .customer {
      background: #dff5e8;
      margin-left: auto;
      text-align: right;
    }

    .admin {
      background: #e8e8e8;
      margin-right: auto;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
      background: white;
    }

    .chat-input input {
      flex: 1;
      border: none;
      padding: 13px;
      outline: none;
      font-size: 14px;
    }

    .chat-input button {
      border: none;
      background: #0b8f4d;
      color: white;
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      color: #0b8f4d;
      text-decoration: none;
      font-weight: bold;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>NEXVORA</h1>
    <p>Customer Support</p>
  </div>

  <div class="container">

    <div class="card">

      <div class="title">
        Contact NEXVORA
      </div>

      <div class="subtitle">
        Choose a method to contact our support team.
      </div>

      <!-- Replace these with your real contact details -->

      <a
        href="https://wa.me/8801XXXXXXXXX"
        class="contact-btn whatsapp"
        target="_blank">
        💬 Contact on WhatsApp
      </a>

      <a
        href="mailto:admin@nexvora.com"
        class="contact-btn email">
        📧 Send Email
      </a>

      <button
        class="contact-btn chat"
        onclick="toggleChat()">
        💬 Online Chat
      </button>

      <div
        class="chat-box"
        id="chatBox">

        <div class="chat-header">
          NEXVORA Support
        </div>

        <div
          class="messages"
          id="messages">

          <div class="message admin">
            Hello! Welcome to NEXVORA Support.
            How can we help you?
          </div>

        </div>

        <div class="chat-input">

          <input
            type="text"
            id="chatInput"
            placeholder="Type your message...">

          <button onclick="sendMessage()">
            Send
          </button>

        </div>

      </div>

    </div>

    <a
      href="index.html"
      class="back">
      ← Back to Home
    </a>

  </div>


  <script>

    function toggleChat() {

      const chatBox =
        document.getElementById("chatBox");

      if (
        chatBox.style.display === "block"
      ) {

        chatBox.style.display = "none";

      } else {

        chatBox.style.display = "block";

      }

    }


    function sendMessage() {

      const input =
        document.getElementById("chatInput");

      const messages =
        document.getElementById("messages");

      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      const message =
        document.createElement("div");

      message.className =
        "message customer";

      message.textContent =
        text;


      messages.appendChild(message);


      input.value = "";


      messages.scrollTop =
        messages.scrollHeight;

    }


    document
      .getElementById("chatInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            sendMessage();
          }

        }
      );

  </script>

</body>
</html>
