<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXVORA Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    width:92%;
    max-width:400px;
    background:white;
    padding:30px 25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    color:#0a8f45;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    background:#0a8f45;
    color:white;
    border:0;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#08783a;
}

.register{
    text-align:center;
    margin-top:18px;
}

.register a{
    color:#0a8f45;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">NEXVORA</div>

    <h2>Login</h2>

    <form onsubmit="loginUser(event)">
        <input type="email" id="email" placeholder="Email" required>

        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

<script>
function loginUser(event){
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const user = JSON.parse(localStorage.getItem("nexvoraUser"));

    if(!user){
        alert("No account found. Please register first.");
        return;
    }

    if(user.email === email && user.password === password){
        localStorage.setItem("nexvoraLoggedIn","true");
        alert("Login successful!");
        window.location.href = "index.html";
    }else{
        alert("Incorrect email or password.");
    }
}
</script>

</body>
</html>
